<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Ceci n'est pas une page</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
         background: #1f3a4d; color: #f2ede4; font-family: Georgia, "Times New Roman", serif; padding: 1.5rem; }
  .frame { max-width: 34rem; border: 6px solid #c9a24b; background: #2b4d63; padding: 2rem 1.5rem; }
  svg { width: 12rem; max-width: 70%; }
  h1 { font-size: 3.5rem; margin: .5rem 0 0; }
  .fr { font-size: 1.6rem; font-style: italic; margin: .25rem 0 1rem; }
  p { margin: 0 0 1.5rem; line-height: 1.5; color: #d6dde3; }
  a { display: inline-block; padding: .7rem 1.4rem; background: #c9a24b; color: #1f3a4d; font-weight: bold; text-decoration: none; border-radius: 4px; }
  a:hover, a:focus-visible { background: #f2ede4; outline: none; }
</style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 200 110" role="img" aria-label="A pipe">
      <path d="M30 20 H90 V45 C90 80 30 80 30 45 Z" fill="#7a4a2b"/>
      <path d="M90 42 C130 42 140 68 182 68 L188 82 C138 84 118 60 90 60 Z" fill="#5a3320"/>
    </svg>
    <h1>404</h1>
    <div class="fr">Ceci n'est pas une page.</div>
    <p>This is not a page. Like the famous pipe, what you are looking at is only a picture of one that does not exist.</p>
    <a href="/">Back to the real world</a>
  </div>
</body>
</html>
